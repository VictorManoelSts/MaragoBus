# Configuração exclusiva do classpath de testes: não importa o .env de desenvolvimento.
spring.application.name=maragobus-test
# Sem ServiceConnection, falha em vez de acessar o banco principal.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/testcontainers_required
spring.datasource.username=test_only
spring.datasource.password=test_only
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
