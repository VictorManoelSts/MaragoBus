spring.application.name=maragobus


spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/maragobus
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# CORS por ambiente (vazio por padrao = fechado em producao; configurar via variavel de ambiente)
maragobus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
maragobus.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}