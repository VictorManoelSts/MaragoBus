services:
  firebase:
    build: ./docker/firebase
    ports:
      - "4000:4000"
      - "8080:8080"
      - "9099:9099"
      - "5001:5001"
      - "9199:9199"
    volumes:
      - .:/app
    command: firebase emulators:start --only auth,firestore,storage

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - firebase
